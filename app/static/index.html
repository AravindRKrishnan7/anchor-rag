<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor</title>
<style>
  :root {
    --navy: #0b2540;
    --navy-2: #12345a;
    --teal: #1f7a8c;
    --teal-dark: #17606e;
    --sand: #f4efe6;
    --ink: #1b2733;
    --muted: #5f6f7f;
    --line: #dfe5ea;
    --card: #ffffff;
    --error-bg: #fdf0ee;
    --error-ink: #9b2c1f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--sand);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-bottom: 3px solid var(--teal);
  }
  .bar {
    max-width: 820px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar svg { width: 30px; height: 30px; flex: none; }
  .bar h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
  .bar p { margin: 0 0 0 auto; font-size: 13px; color: #b9cde0; }
  .reset {
    font: inherit;
    font-size: 13px;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .reset:hover { border-color: #fff; }
  .reset:disabled { opacity: 0.45; cursor: not-allowed; }
  @media (max-width: 520px) {
    .bar p { display: none; }
    .reset { margin-left: auto; }
  }

  main {
    flex: 1;
    overflow-y: auto;
  }
  #log {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .welcome { text-align: center; color: var(--muted); padding: 40px 0 10px; }
  .welcome h2 { color: var(--navy); font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .welcome p { margin: 0 0 20px; }
  .examples { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .examples button {
    font: inherit;
    font-size: 15px;
    color: var(--navy);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    max-width: 100%;
  }
  .examples button:hover { border-color: var(--teal); color: var(--teal-dark); }

  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user {
    align-self: flex-end;
    background: var(--navy);
    color: #fff;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(11, 37, 64, 0.05);
  }
  .msg.error { background: var(--error-bg); border-color: #f1cfc9; color: var(--error-ink); }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .msg.bot p, .msg.bot ul, .msg.bot ol, .msg.bot blockquote { margin: 0 0 10px; }
  .msg.bot ul, .msg.bot ol { padding-left: 22px; }
  .msg.bot blockquote {
    border-left: 3px solid var(--teal);
    padding: 2px 0 2px 12px;
    color: #384858;
    font-style: italic;
  }
  .msg.bot code { background: var(--sand); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }

  .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal);
    animation: bob 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }

  footer { background: var(--sand); border-top: 1px solid var(--line); }
  form {
    max-width: 820px;
    margin: 0 auto;
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    font: inherit;
    color: var(--ink);
    resize: none;
    min-height: 48px;
    max-height: 160px;
    padding: 12px 14px;
    border: 1px solid #c9d3dc;
    border-radius: 12px;
    background: #fff;
  }
  textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: transparent; }
  button.send {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--teal);
    border: 0;
    border-radius: 12px;
    height: 48px;
    padding: 0 22px;
    cursor: pointer;
  }
  button.send:hover { background: var(--teal-dark); }
  button.send:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
  .hint { max-width: 820px; margin: -8px auto 0; padding: 0 16px 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="5" r="2.2"/>
      <path d="M12 7.2V21"/>
      <path d="M8 11h8"/>
      <path d="M4.5 13.5a7.5 7.5 0 0 0 15 0"/>
      <path d="M3 14.5l1.5-1 1.5 1M18 14.5l1.5-1 1.5 1"/>
    </svg>
    <h1>Anchor</h1>
    <p>Maritime professionals &amp; training</p>
    <button class="reset" id="reset" type="button">New conversation</button>
  </div>
</header>

<main id="scroller">
  <div id="log" aria-live="polite">
    <div class="welcome" id="welcome">
      <h2>Ask about people, courses and interviews</h2>
      <p>Answers usually take 20–60 seconds.</p>
      <div class="examples">
        <button type="button">Has anyone dealt with a ship losing all power at sea?</button>
        <button type="button">What advice is there for someone buying a used vessel?</button>
        <button type="button">Are there seats left in Basic Safety Training?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" aria-label="Your question" required></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</footer>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const log = document.getElementById("log");
const scroller = document.getElementById("scroller");
const welcome = document.getElementById("welcome");
const reset = document.getElementById("reset");

// Earlier questions and answers, sent with each request so follow-ups work.
// The server keeps the same number; sending more would just be dropped.
const HISTORY_MESSAGES = 6;
const history = [];

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

// Bold, italic and code on already-escaped text.
function inline(text) {
  return text
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, "$1<em>$2</em>");
}

// Just enough Markdown for model answers: paragraphs, headings, lists and
// quotes. Everything is escaped first, so the model can't inject HTML.
function renderMarkdown(source) {
  const lines = escapeHtml(source.trim()).split("\n");
  const html = [];
  let block = null; // {tag, items}
  const flush = () => {
    if (!block) return;
    if (block.tag === "p") html.push(`<p>${block.items.map(inline).join("<br>")}</p>`);
    else if (block.tag === "blockquote") html.push(`<blockquote>${block.items.map(inline).join("<br>")}</blockquote>`);
    else html.push(`<${block.tag}>${block.items.map(i => `<li>${inline(i)}</li>`).join("")}</${block.tag}>`);
    block = null;
  };
  const add = (tag, text) => {
    if (!block || block.tag !== tag) { flush(); block = {tag, items: []}; }
    block.items.push(text);
  };
  for (const raw of lines) {
    const line = raw.trim();
    let m;
    if (!line || /^(-{3,}|\*{3,})$/.test(line)) flush();
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) { flush(); html.push(`<p><strong>${inline(m[1])}</strong></p>`); }
    else if ((m = line.match(/^&gt;\s?(.*)/))) add("blockquote", m[1]);
    else if ((m = line.match(/^[-*+]\s+(.*)/))) add("ul", m[1]);
    else if ((m = line.match(/^\d+[.)]\s+(.*)/))) add("ol", m[1]);
    else if (block && (block.tag === "ul" || block.tag === "ol")) block.items[block.items.length - 1] += " " + line;
    else add("p", line);
  }
  flush();
  return html.join("");
}

function addMessage(kind, html) {
  welcome.remove();
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.innerHTML = html;
  log.appendChild(el);
  scroller.scrollTop = scroller.scrollHeight;
  return el;
}

function setBusy(busy) {
  input.disabled = busy;
  send.disabled = busy;
  reset.disabled = busy;
  if (!busy) input.focus();
}

async function ask(question) {
  addMessage("user", escapeHtml(question));
  const pending = addMessage("bot",
    '<div class="thinking"><span class="dots"><span></span><span></span><span></span></span>' +
    '<span class="label">Thinking…</span></div>');
  const label = pending.querySelector(".label");
  const started = Date.now();
  const timer = setInterval(() => {
    label.textContent = `Thinking… ${Math.round((Date.now() - started) / 1000)}s`;
  }, 1000);
  setBusy(true);
  try {
    let response;
    try {
      response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question, history: history.slice(-HISTORY_MESSAGES)}),
      });
    } catch {
      throw new Error("Couldn't reach the server. Is it running?");
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = typeof data.detail === "string" ? data.detail : `Request failed (${response.status})`;
      throw new Error(`Sorry, something went wrong: ${detail}.`);
    }
    pending.innerHTML = renderMarkdown(data.answer || "(No answer was returned.)");
    // Only completed exchanges go into history, never a failed question.
    if (data.answer) {
      history.push({role: "user", content: question}, {role: "assistant", content: data.answer});
    }
  } catch (error) {
    pending.classList.add("error");
    pending.textContent = error.message;
  } finally {
    clearInterval(timer);
    setBusy(false);
    scroller.scrollTop = scroller.scrollHeight;
  }
}

function submit() {
  const question = input.value.trim();
  if (!question || send.disabled) return;
  input.value = "";
  input.style.height = "";
  ask(question);
}

form.addEventListener("submit", event => { event.preventDefault(); submit(); });
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    submit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.querySelectorAll(".examples button").forEach(button => {
  button.addEventListener("click", () => ask(button.textContent));
});
reset.addEventListener("click", () => {
  history.length = 0;
  log.replaceChildren(welcome);
  input.value = "";
  input.style.height = "";
  input.focus();
});
input.focus();
</script>
</body>
</html>
