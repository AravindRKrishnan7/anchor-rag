<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor · Update a course</title>
<style>
  :root {
    --navy: #0b2540;
    --navy-2: #12345a;
    --teal: #1f7a8c;
    --teal-dark: #17606e;
    --sand: #f4efe6;
    --ink: #1b2733;
    --muted: #5f6f7f;
    --line: #dfe5ea;
    --card: #ffffff;
    --error-bg: #fdf0ee;
    --error-ink: #9b2c1f;
    --warn-bg: #fdf6e3;
    --warn-ink: #7a5b10;
    --change-bg: #e8f4f6;
    --ok-bg: #e9f5ec;
    --ok-ink: #1e6b34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-bottom: 3px solid var(--teal);
  }
  .bar {
    max-width: 820px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar svg { width: 30px; height: 30px; flex: none; }
  .bar h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
  .bar a { margin-left: auto; font-size: 13px; color: #b9cde0; }

  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  h2 { color: var(--navy); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h3 { color: var(--navy); font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px rgba(11, 37, 64, 0.05);
    margin-bottom: 16px;
  }
  .pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=file] { flex: 1; min-width: 0; font: inherit; font-size: 15px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--teal);
    border: 0;
    border-radius: 12px;
    height: 44px;
    padding: 0 22px;
    cursor: pointer;
  }
  button:hover { background: var(--teal-dark); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .meta { font-size: 13px; color: var(--muted); margin: 0 0 12px; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  tr.changed td { background: var(--change-bg); }
  tr.changed td.new { font-weight: 600; color: var(--teal-dark); }
  .empty { color: var(--muted); font-style: italic; }
  .aside { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; margin: 0 4px 4px 0; }
  .tag.new { background: var(--change-bg); color: var(--teal-dark); }
  .tag.exists { background: var(--line); color: var(--muted); }
  .tag.needs_capacity { background: var(--warn-bg); color: var(--warn-ink); }
  .tag.seats { background: var(--ok-bg); color: var(--ok-ink); }
  input.capacity {
    width: 90px;
    font: inherit;
    padding: 4px 8px;
    border: 1px solid #c9d3dc;
    border-radius: 8px;
  }
  input.capacity:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: transparent; }
  input.capacity:invalid:not(:placeholder-shown) { border-color: var(--error-ink); }

  .choice { background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
  .choice p { margin: 0 0 8px; color: var(--warn-ink); font-weight: 600; }
  .choice label {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-top: 8px; cursor: pointer;
  }
  .choice label:has(input:checked) { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
  .choice input { margin-top: 4px; accent-color: var(--teal); }

  .note { border-radius: 10px; padding: 10px 14px; margin: 12px 0 0; font-size: 15px; }
  .note.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .note.error { background: var(--error-bg); color: var(--error-ink); }
  .note.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .note ul { margin: 0; padding-left: 20px; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .actions span { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="5" r="2.2"/>
      <path d="M12 7.2V21"/>
      <path d="M8 11h8"/>
      <path d="M4.5 13.5a7.5 7.5 0 0 0 15 0"/>
      <path d="M3 14.5l1.5-1 1.5 1M18 14.5l1.5-1 1.5 1"/>
    </svg>
    <h1>Anchor</h1>
    <a href="/">Back to chat</a>
  </div>
</header>

<main>
  <h2>Update a course from a PDF</h2>
  <p class="lead">Upload a course notice or brochure. Nothing is saved until you approve.</p>

  <div class="card">
    <form class="pick" id="pick">
      <input type="file" id="file" accept="application/pdf,.pdf" aria-label="Course PDF" required>
      <button type="submit" id="read">Read PDF</button>
    </form>
    <div class="note error" id="upload-error" hidden></div>
  </div>

  <div class="card" id="draft" hidden>
    <h2 id="draft-title"></h2>
    <p class="meta" id="draft-meta"></p>
    <fieldset class="choice" id="choice" hidden style="border:0">
      <p>This PDF may describe a course already in the directory. Choose one:</p>
      <div id="choices"></div>
    </fieldset>
    <div id="comparison" hidden>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Field</th><th>Current</th><th>From PDF</th></tr></thead>
          <tbody id="fields"></tbody>
        </table>
      </div>
      <div id="batches-section">
        <h3>Batches in the PDF</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Dates</th><th>Location</th><th>Capacity</th><th>Seats open</th><th></th></tr></thead>
            <tbody id="batches"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="note warn" id="warnings" hidden></div>
    <div class="note warn" id="blocked" hidden></div>
    <div class="actions">
      <button type="button" id="approve" disabled>Approve</button>
      <span id="approve-hint"></span>
    </div>
    <div class="note error" id="apply-error" hidden></div>
    <div class="note ok" id="applied" hidden></div>
  </div>
</main>

<script>
const LABELS = {name: "Course name", code: "Code", duration_days: "Duration", fee_inr: "Fee"};
const STATUS = {new: "Will be added", exists: "Already listed", needs_capacity: "Enter capacity to add"};
const $ = id => document.getElementById(id);
let draft = null;
let option = null;  // the chosen entry of draft.options

function show(id, text) { $(id).textContent = text; $(id).hidden = !text; }

function format(field, value) {
  if (value === null || value === undefined) return null;
  if (field === "fee_inr") return "₹" + Number(value).toLocaleString("en-IN");
  if (field === "duration_days") return `${value} days`;
  return String(value);
}

function formatDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"});
}

function cell(text, className) {
  const td = document.createElement("td");
  if (text === null) { td.textContent = "not in PDF"; td.className = "empty"; }
  else td.textContent = text;
  if (className) td.classList.add(className);
  return td;
}

function tag(kind, text) {
  const span = document.createElement("span");
  span.className = `tag ${kind}`;
  span.textContent = text;
  return span;
}

async function post(url, options) {
  let response;
  try {
    response = await fetch(url, {method: "POST", ...options});
  } catch {
    throw new Error("Couldn't reach the server. Is it running?");
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(typeof data.detail === "string" ? data.detail : `Request failed (${response.status})`);
  }
  return data;
}

function renderDraft(d) {
  draft = d;
  option = null;
  const pdfName = [d.pdf.name, d.pdf.code].filter(Boolean).join(" · ");
  $("draft-title").textContent = pdfName || "Course from PDF";
  $("draft-meta").textContent = `${d.institute || d.pdf.institute || "Unknown institute"} · from ${d.source_file}`;

  const choices = $("choices");
  choices.replaceChildren();
  if (d.requires_choice) {
    for (const o of d.options) {
      const match = d.likely_matches.find(m => m.target === o.target);
      const label = document.createElement("label");
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "target";
      radio.addEventListener("change", () => choose(o));
      const text = document.createElement("span");
      const title = document.createElement("strong");
      title.textContent = match
        ? `Update this existing course: ${match.name}${match.code ? ` (${match.code})` : ""}`
        : "Create as new course";
      const aside = document.createElement("span");
      aside.className = "aside";
      aside.textContent = match
        ? `${match.reason}. Keeps its name and code; updates fee, duration, batches and seats.`
        : `Adds ${pdfName || "it"} alongside the existing course.`;
      text.append(title, aside);
      label.append(radio, text);
      choices.appendChild(label);
    }
  }
  $("choice").hidden = !d.requires_choice;

  const warnings = $("warnings");
  warnings.replaceChildren();
  if (d.warnings.length) {
    const ul = document.createElement("ul");
    for (const w of d.warnings) { const li = document.createElement("li"); li.textContent = w; ul.appendChild(li); }
    warnings.appendChild(ul);
  }
  warnings.hidden = d.warnings.length === 0;

  show("apply-error", "");
  show("applied", "");
  $("approve").hidden = false;
  $("approve-hint").hidden = false;
  $("draft").hidden = false;
  if (d.requires_choice) {
    $("comparison").hidden = true;
    show("blocked", "");
    updateApprove();
  } else {
    choose(d.options[0]);
  }
}

function choose(o) {
  option = o;
  const isNew = o.target === "new";
  const fields = $("fields");
  fields.replaceChildren();
  for (const f of o.fields) {
    const tr = document.createElement("tr");
    if (f.changed) tr.className = "changed";
    let shown = null;
    if (f.new !== null) {
      shown = format(f.field, f.new);
      if (f.kept) shown += " (not applied: keeps current)";
      else if (!f.changed && !isNew) shown += " (no change)";
    }
    tr.append(
      cell(LABELS[f.field]),
      isNew ? cell("—") : cell(format(f.field, f.current) ?? "—"),
      cell(shown, "new"),
    );
    fields.appendChild(tr);
  }

  const batches = $("batches");
  batches.replaceChildren();
  for (const b of o.batches) {
    const tr = document.createElement("tr");
    const capacity = document.createElement("td");
    if (b.status === "needs_capacity") {
      const input = document.createElement("input");
      input.type = "number";
      input.className = "capacity";
      input.min = Math.max(1, b.seats_available ?? 1);
      input.step = 1;
      input.required = true;
      input.placeholder = "Seats";
      input.dataset.index = b.index;
      input.setAttribute("aria-label", `Capacity for batch starting ${formatDate(b.start_date)}`);
      input.addEventListener("input", updateApprove);
      capacity.appendChild(input);
    } else {
      capacity.textContent = String(b.existing_capacity ?? b.capacity);
    }
    const status = document.createElement("td");
    status.appendChild(tag(b.status, STATUS[b.status]));
    if (b.seat_report) status.appendChild(tag("seats", "Seat count recorded"));
    tr.append(
      cell(`${formatDate(b.start_date)} – ${formatDate(b.end_date)}`),
      cell(b.location ?? "—"),
      capacity,
      cell(b.seats_available === null ? "—" : String(b.seats_available)),
      status,
    );
    batches.appendChild(tr);
  }
  $("batches-section").hidden = o.batches.length === 0;
  $("comparison").hidden = false;
  show("blocked", o.can_apply ? "" : o.blocked_reason);
  updateApprove();
}

function capacityInputs() { return [...document.querySelectorAll("input.capacity")]; }

function updateApprove() {
  let hint = "";
  if (!option) hint = "Choose an option above";
  else if (!option.can_apply) hint = "";
  else if (capacityInputs().some(i => !i.value || !i.checkValidity())) {
    hint = "Enter the capacity for each new batch (at least its open seats)";
  } else hint = "Saves the highlighted changes";
  $("approve").disabled = !option || !option.can_apply || hint !== "Saves the highlighted changes";
  $("approve-hint").textContent = hint;
}

$("pick").addEventListener("submit", async event => {
  event.preventDefault();
  const file = $("file").files[0];
  if (!file) return;
  const read = $("read");
  read.disabled = true;
  read.textContent = "Reading…";
  show("upload-error", "");
  $("draft").hidden = true;
  try {
    const body = new FormData();
    body.append("file", file);
    renderDraft(await post("/courses/upload-pdf", {body}));
  } catch (error) {
    show("upload-error", error.message);
  } finally {
    read.disabled = false;
    read.textContent = "Read PDF";
  }
});

$("approve").addEventListener("click", async () => {
  const approve = $("approve");
  approve.disabled = true;
  approve.textContent = "Saving…";
  show("apply-error", "");
  const capacities = Object.fromEntries(capacityInputs().map(i => [i.dataset.index, Number(i.value)]));
  try {
    const result = await post("/courses/apply-draft", {
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({draft_id: draft.draft_id, target: option.target, capacities}),
    });
    const parts = Object.entries(result.changes).map(([f, c]) => `${LABELS[f]} ${format(f, c.new)}`);
    const count = (n, word) => `${n} ${word}${n > 1 ? "s" : ""}`;
    if (result.batches_added.length) parts.push(count(result.batches_added.length, "new batch").replace("batchs", "batches"));
    if (result.seat_reports.length) parts.push(count(result.seat_reports.length, "seat count"));
    $("applied").replaceChildren(`Saved: ${parts.join(", ")}. The chatbot uses it now. `);
    const link = document.createElement("a");
    link.href = "/";
    link.textContent = "Ask the chatbot";
    $("applied").appendChild(link);
    $("applied").hidden = false;
    approve.hidden = true;
    $("approve-hint").hidden = true;
    document.querySelectorAll("#choice input, input.capacity").forEach(i => { i.disabled = true; });
  } catch (error) {
    show("apply-error", error.message);
    updateApprove();
  } finally {
    approve.textContent = "Approve";
  }
});
</script>
</body>
</html>
