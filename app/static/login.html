<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor · Admin login</title>
<style>
  :root {
    --navy: #0b2540;
    --navy-2: #12345a;
    --teal: #1f7a8c;
    --teal-dark: #17606e;
    --sand: #f4efe6;
    --ink: #1b2733;
    --muted: #5f6f7f;
    --line: #dfe5ea;
    --card: #ffffff;
    --error-bg: #fdf0ee;
    --error-ink: #9b2c1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-bottom: 3px solid var(--teal);
  }
  .bar {
    max-width: 820px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar svg { width: 30px; height: 30px; flex: none; }
  .bar h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
  .bar a { margin-left: auto; font-size: 13px; color: #b9cde0; }

  main { max-width: 420px; margin: 0 auto; padding: 40px 16px; }
  h2 { color: var(--navy); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(11, 37, 64, 0.05);
  }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin: 0 0 4px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    padding: 10px 12px;
    border: 1px solid #c9d3dc;
    border-radius: 10px;
    margin: 0 0 14px;
  }
  input:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--teal);
    border: 0;
    border-radius: 12px;
    height: 44px;
    cursor: pointer;
  }
  button:hover { background: var(--teal-dark); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .error { background: var(--error-bg); color: var(--error-ink); border-radius: 10px; padding: 10px 14px; margin: 14px 0 0; font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="5" r="2.2"/>
      <path d="M12 7.2V21"/>
      <path d="M8 11h8"/>
      <path d="M4.5 13.5a7.5 7.5 0 0 0 15 0"/>
      <path d="M3 14.5l1.5-1 1.5 1M18 14.5l1.5-1 1.5 1"/>
    </svg>
    <h1>Anchor</h1>
    <a href="/">Back to chat</a>
  </div>
</header>

<main>
  <h2>Admin login</h2>
  <p class="lead">Course updates and seat counts need an admin account.</p>
  <form class="card" id="form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit">Log in</button>
    <div class="error" id="error" role="alert" hidden></div>
  </form>
</main>

<script>
const form = document.getElementById("form");
const submit = document.getElementById("submit");
const error = document.getElementById("error");

form.addEventListener("submit", async event => {
  event.preventDefault();
  submit.disabled = true;
  submit.textContent = "Logging in…";
  error.hidden = true;
  const body = new FormData(form);
  // The server checks next is a local /admin page before using it.
  body.append("next", new URLSearchParams(location.search).get("next") || "");
  try {
    let response;
    try {
      response = await fetch("/admin/login", {method: "POST", body});
    } catch {
      throw new Error("Couldn't reach the server. Is it running?");
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(typeof data.detail === "string" ? data.detail : `Login failed (${response.status})`);
    }
    location.assign(data.next);
  } catch (e) {
    error.textContent = e.message;
    error.hidden = false;
    document.getElementById("password").value = "";
    submit.disabled = false;
    submit.textContent = "Log in";
  }
});
</script>
</body>
</html>
